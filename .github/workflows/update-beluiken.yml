name: Update beluiken data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_beluiken.py, .github/workflows/update-beluiken.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyproj
      - run: python scripts/fetch_beluiken.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update beluiken data from the heritage inventory"
          git pull --rebase origin main && git push
