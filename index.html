<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ghent Walk</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: full-screen map, floating controls, bottom sheet for stories */
  :root {
    --ink: #1c2730;
    --muted: #5d6b75;
    --paper: #ffffff;
    --wash: #f2f5f6;
    --accent: #b5462b;      /* Ghent brick red */
    --accent-2: #1f3a4d;    /* Lys water blue */
    --line: #dde3e6;
    --green: #2f7d5b;       /* beluik courtyards */
    --gold: #b88a1b;
    --mary: #3d6fb6;        /* Marian blue */
    --night: #4b3f72;       /* night shops */
    --night-open: #7b4fd6;
    --geek: #0f8a8a;        /* geek stores */
    --route: #e08a00;       /* walk route: amber */
    --display: "Fraunces", Georgia, serif;
    --body: "Inter", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8edf0; --muted:#a3b0b8; --paper:#1a2329; --wash:#232e35; --line:#33414a; --accent:#e0704f; --accent-2:#8fc1df; --green:#5cb88d; --gold:#d9ad45; --mary:#7aa5e6; --night:#8e83b8; --night-open:#a98bf0; --geek:#3cc2c2; --route:#ffb238; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--body); color: var(--ink); background: var(--paper); overflow: hidden; }
  #map { position: absolute; inset: 0; }

  .topbar {
    position: absolute; z-index: 1050; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    display: flex; gap: 8px; align-items: center; pointer-events: none;
  }
  .brand {
    pointer-events: auto; background: var(--paper); border-radius: 12px; padding: 8px 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); font-family: var(--display); font-size: 18px; font-weight: 600;
    color: var(--accent-2);
  }
  .btn { white-space: nowrap; }
  @media (max-width: 380px) { .brand small { display: none; } }
  .brand small { display:block; font-family: var(--body); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
  .spacer { flex: 1; }
  .btn {
    pointer-events: auto; border: 0; cursor: pointer; background: var(--paper); color: var(--ink);
    border-radius: 12px; height: 44px; padding: 0 14px; font: 600 14px var(--body);
    box-shadow: 0 2px 10px rgba(0,0,0,.18); display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: #fff; }

  .status {
    position: absolute; z-index: 1050; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 66px); background: var(--accent-2); color: #fff;
    padding: 8px 14px; border-radius: 20px; font-size: 13px; max-width: calc(100% - 32px); text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
  }

  /* Numbered landmark pins */
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--accent); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
    display: grid; place-items: center;
  }
  .pin span { transform: rotate(45deg); color: #fff; font: 700 12px var(--body); }
  .pin.visited { background: #6b7d88; }
  .pin.active { background: var(--accent-2); }
  .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.25); }

  /* Bottom sheet */
  .sheet {
    position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; max-height: 62%;
    background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.2);
    display: flex; flex-direction: column; transform: translateY(105%); transition: transform .25s ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform: translateY(0); }
  @media (min-width: 760px) {
    .sheet { left: auto; right: 16px; bottom: 16px; top: 80px; width: 400px; max-height: none; border-radius: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  .sheet-head { padding: 10px 16px 6px; display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--line); }
  .grab { position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--line); }
  .sheet-head h2 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 10px 0 2px; text-wrap: balance; }
  .meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 10px; flex-wrap: wrap; }
  .close { margin-left: auto; margin-top: 8px; background: var(--wash); border: 0; border-radius: 50%; width: 36px; height: 36px; font-size: 20px; cursor: pointer; color: var(--ink); flex: none; }
  .sheet-body { overflow-y: auto; padding: 12px 16px 16px; -webkit-overflow-scrolling: touch; }
  .sheet-body p { line-height: 1.6; margin: 0 0 12px; max-width: 65ch; }
  .fact { background: var(--wash); border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .fact b { color: var(--accent); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a, .actions button { text-decoration: none; }
  .actions .btn { box-shadow: none; border: 1px solid var(--line); height: 40px; }

  /* List view */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li button {
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 4px; display: flex; gap: 12px; align-items: center; cursor: pointer; color: var(--ink); font: inherit;
  }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .num.visited { background: #6b7d88; }
  .li-text { min-width: 0; flex: 1; }
  .li-text strong { display: block; font-weight: 600; }
  .li-text span { font-size: 12px; color: var(--muted); }
  .dist { font-size: 13px; color: var(--accent-2); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* Layer chips */
  .chips {
    position: absolute; z-index: 1050; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 74px);
    padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; pointer-events: auto; padding-block: 4px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips[hidden] { display: none !important; }
  .chip { flex: none;
    pointer-events: auto; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 999px; height: 34px; padding: 0 12px; font: 600 13px var(--body); cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,.14);
  }
  .chip[aria-pressed="true"] { background: var(--accent-2); border-color: var(--accent-2); color: var(--paper); }
  .status { top: calc(env(safe-area-inset-top, 0px) + 70px); font-size: 13px; padding: 7px 12px; }
  .brand { padding: 10px 14px; }
  .btn svg { flex: none; }
  .fab {
    position: absolute; z-index: 1000; border: 0; cursor: pointer;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    width: 56px; height: 56px; border-radius: 50%; background: var(--paper); color: var(--accent);
    box-shadow: 0 3px 14px rgba(0,0,0,.25); display: grid; place-items: center;
  }
  .fab.on { background: var(--accent); color: #fff; }
  .fab:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
  @media (pointer: coarse) { .leaflet-control-zoom { display: none; } }
  .leaflet-bottom.leaflet-right .leaflet-control-zoom { margin-bottom: 96px; }
  /* Layers panel */
  .layer-row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .layer-row .li-text { min-width: 0; flex: 1; }
  .switch { position: relative; width: 46px; height: 28px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent-2); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .li-text span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .walkpill {
    position: absolute; z-index: 1000; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
    height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--accent-2); color: #fff; cursor: pointer;
    font: 600 14px var(--body); display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 3px 14px rgba(0,0,0,.25);
    max-width: calc(100% - 110px);
  }
  .walkpill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guide {
    position: absolute; z-index: 1060; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 10px); background: var(--accent-2); color: #fff; border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 4px;
  }
  @media (min-width: 760px) { .guide { right: auto; width: 380px; } }
  .guide:not([hidden]) ~ .topbar, body:has(.guide:not([hidden])) .topbar { visibility: hidden; }
  .g-top { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .g-link { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
  .g-name { font-family: var(--display); font-weight: 600; font-size: 22px; text-wrap: balance; }
  .g-dist { font-size: 15px; font-variant-numeric: tabular-nums; }
  .g-turn { font-size: 15px; font-weight: 600; background: rgba(255,255,255,.14); border-radius: 10px; padding: 8px 10px; margin-top: 4px; }
  .g-actions { display: flex; gap: 8px; margin-top: 6px; }
  .g-actions .btn { height: 36px; box-shadow: none; background: rgba(255,255,255,.16); color: #fff; }
  .stopnum { width: 26px; height: 26px; border-radius: 50%; background: var(--route); color: #fff; border: 2px solid #fff; display: grid; place-items: center; font: 700 12px var(--body); box-shadow: 0 1px 5px rgba(0,0,0,.35); }
  .stopnum.done { background: #6b7d88; }
  .stopnum.static { flex: none; border: 0; box-shadow: none; }
  .group-h { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
  .sheet-search { position: sticky; top: -12px; background: var(--paper); padding-top: 2px; z-index: 1; }

  /* Beluik pins: square = courtyard */
  .bpin { width: 18px; height: 18px; border-radius: 4px; background: var(--green); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); position: relative; }
  .bpin.gone { background: #fff; border: 2px dashed #6b7d88; }
  .bpin.doc::after { content: ""; position: absolute; right: -5px; top: -5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 1.5px solid #fff; }
  .bpin.home { background: var(--accent); width: 22px; height: 22px; }
  .bpin.custom { background: var(--gold); }
  .mpin { width: 18px; height: 18px; border-radius: 50%; background: var(--mary); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); position: relative; }
  .mpin::before { content: "M"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 700 9px var(--body); }
  .mpin.gone { background: #fff; border: 2px dashed #6b7d88; } .mpin.gone::before { color: #6b7d88; }
  .mpin.doc::after { content: ""; position: absolute; right: -5px; top: -5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 1.5px solid #fff; }
  .mpin.home { outline: 3px solid var(--accent); } .mpin.custom { background: var(--gold); }
  .npin { width: 16px; height: 16px; border-radius: 50%; background: var(--night); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .npin.open { background: var(--night-open); } .npin.closed { opacity: .55; }
  .nnum { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--night); }
  .nnum.open { background: var(--night-open); } .nnum.closed { opacity: .55; }
  .gpin { width: 16px; height: 16px; border-radius: 4px; transform: rotate(45deg); background: var(--geek); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .gnum { flex: none; width: 18px; height: 18px; border-radius: 4px; transform: rotate(45deg); background: var(--geek); margin: 2px; }
  .gpin.active, .npin.active, .mpin.active, .bpin.active { outline: 3px solid var(--accent-2); outline-offset: 1px; }

  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--wash); color: var(--muted); }
  .tag.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .tag.gone { background: color-mix(in srgb, #6b7d88 18%, transparent); }
  .tag.prot { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 14px; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .hero { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background: var(--wash); display: block; }
  details.more { margin-bottom: 14px; }
  details.more summary { cursor: pointer; font-weight: 600; color: var(--accent-2); font-size: 14px; margin-bottom: 8px; }
  .desc { white-space: pre-line; font-size: 14px; line-height: 1.6; color: var(--ink); margin-bottom: 14px; }
  h3.sec { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    font: 16px var(--body); color: var(--ink); background: var(--wash); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
  }
  .field textarea { min-height: 90px; resize: vertical; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: var(--wash); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer; color: var(--ink); font-weight: 500; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .photo { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--wash); max-width: 100%; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }
  .saved { font-size: 12px; color: var(--muted); }
  .search { width: 100%; font: 16px var(--body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--wash); color: var(--ink); margin-bottom: 8px; }
  .bnum { flex: none; width: 22px; height: 22px; border-radius: 5px; background: var(--green); }
  .bnum.gone { background: transparent; border: 2px dashed #6b7d88; }
  .bnum.custom { background: var(--gold); }
  .bnum.home { background: var(--accent); }
  .mnum { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--mary); }
  .mnum.gone { background: transparent; border: 2px dashed #6b7d88; } .mnum.custom { background: var(--gold); } .mnum.home { outline: 3px solid var(--accent); }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
  .row-actions .btn { box-shadow: none; border: 1px solid var(--line); height: 40px; text-decoration: none; }

  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-bottom.leaflet-right { margin-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Ghent"></div>

<div class="topbar">
  <div class="brand">Ghent Walk</div>
  <div class="spacer"></div>
  <button class="btn" id="listBtn" aria-label="Search and browse"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Search</button>
  <button class="btn" id="layersBtn" aria-label="Choose what the map shows"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Z" fill="currentColor"/><path d="m2 13 10 5.5L22 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Layers</button>
</div>
<button class="fab" id="locateBtn" aria-label="Show where I am"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<div class="chips" role="toolbar" aria-label="What to show" hidden>
  <button class="chip" id="chipSights" aria-pressed="true">Sights</button>
  <button class="chip" id="chipBeluiken" aria-pressed="true">Beluiken</button>
  <button class="chip" id="chipMaria" aria-pressed="true">Mary statues</button>
  <button class="chip" id="chipNight" aria-pressed="false">Night shops</button>
  <button class="chip" id="chipGeek" aria-pressed="false">Geek stores</button>
  <button class="chip" id="chipGone" aria-pressed="false">Gone too</button>
</div>
<div class="status" id="status" hidden></div>
<button class="walkpill" id="walkPill" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="2.5" fill="currentColor"/><circle cx="19" cy="5" r="2.5" fill="currentColor"/><path d="M7 18c6 0 2-7 7-7s3-5 3-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 3" stroke-linecap="round"/></svg><span>Your walk</span></button>
<div class="guide" id="guide" hidden role="status" aria-live="polite">
  <div class="g-top"><span id="g-count"></span><button id="g-list" class="g-link">All stops</button></div>
  <div class="g-name" id="g-name"></div>
  <div class="g-dist" id="g-dist"></div>
  <div class="g-turn" id="g-turn" hidden></div>
  <div class="g-actions"><button class="btn" id="g-skip">Skip stop</button><button class="btn" id="g-stop">End walk</button></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="grab"></div>
  <div class="sheet-head">
    <div style="min-width:0">
      <h2 id="sheetTitle"></h2>
      <div class="meta" id="sheetMeta"></div>
    </div>
    <button class="close" id="closeBtn" aria-label="Close">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PLACES = [
  { id: "gravensteen", name: "Gravensteen", nl: "Castle of the Counts", built: "1180", lat: 51.0573, lng: 3.7206,
    text: [
      "Philip of Alsace, Count of Flanders, built this stone castle in 1180 on the site of an older wooden fortress. It was meant to protect the count, and just as much to impress and intimidate the proud, rebellious citizens of Ghent.",
      "When the counts moved out in the 14th century, the castle became a courthouse, a mint and a prison, complete with a torture chamber. In the 19th century it was even used as a cotton mill and workers' housing, and the city almost demolished it.",
      "Instead it was bought by the city and restored around 1900, with a fair amount of romantic imagination added to the battlements."],
    fact: "In 1949 students occupied the castle in a protest against a beer price increase. The event is still remembered every year." },
  { id: "belfort", name: "Belfry of Ghent", nl: "Belfort", built: "1313–1380", lat: 51.0537, lng: 3.7248,
    text: [

  { id: "baafs", name: "St Bavo's Cathedral", nl: "Sint-Baafskathedraal", built: "12th–16th c.", lat: 51.0530, lng: 3.7268,

      "It started as a parish church dedicated to St John and grew over four centuries from Romanesque to late Gothic. It became the cathedral of the new Diocese of Ghent in 1559 and was renamed after St Bavo.",

  { id: "korenlei", name: "Korenlei", nl: "Korenlei", built: "16th–18th c.", lat: 51.0548, lng: 3.7197,

  { id: "michiel", name: "St Michael's Bridge", nl: "Sint-Michielsbrug", built: "1905–1909", lat: 51.0541, lng: 3.7193,
    text: [

  { id: "stadhuis", name: "City Hall", nl: "Stadhuis", built: "1519–1600s", lat: 51.0543, lng: 3.7253,

  { id: "patershol", name: "Patershol", nl: "Patershol", built: "medieval", lat: 51.0584, lng: 3.7224,
    text: [

const STORE_KEY = "ghentwalk.visited";
let visited = new Set();
try { visited = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (e) {}
function saveVisited() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...visited])); } catch (e) {} }

let me = null, meMarker = null, meCircle = null, watchId = null, follow = false, activeId = null;

// ---- map ----
const map = L.map("map", { zoomControl: false }).setView([51.0545, 3.7235], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
L.control.zoom({ position: "bottomright" }).addTo(map);

const markers = {};
const sightsLayer = L.layerGroup().addTo(map);
function pinIcon(p, i) {
  const cls = ["pin", visited.has(p.id) ? "visited" : "", activeId === p.id ? "active" : ""].join(" ");
  return L.divIcon({ className: "", html: `<div class="${cls}"><span>${i + 1}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 36] });
}
function refreshPins() { PLACES.forEach((p, i) => markers[p.id].setIcon(pinIcon(p, i))); }
PLACES.forEach((p, i) => {
  markers[p.id] = L.marker([p.lat, p.lng], { icon: pinIcon(p, i), title: p.name, keyboard: true })
    .addTo(sightsLayer).on("click", () => openPlace(p.id));
});

// ---- helpers ----
function distM(a, b) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(m) { return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`; }
function walkMin(m) { return Math.max(1, Math.round(m / 80)); } // ~4.8 km/h
const $ = id => document.getElementById(id);
let statusTimer;
function status(msg, ms = 4000) {
  const s = $("status"); s.textContent = msg; s.hidden = false;
  clearTimeout(statusTimer); if (ms) statusTimer = setTimeout(() => (s.hidden = true), ms);
}

// ---- sheet ----
function openSheet() { $("sheet").classList.add("open"); }
map.on("click", () => { if ($("sheet").classList.contains("open")) closeSheet(); });
function closeSheet() { $("sheet").classList.remove("open"); activeId = null; refreshPins(); refreshBPins(); }
$("closeBtn").onclick = closeSheet;

function openPlace(id) {
  const p = PLACES.find(x => x.id === id); const i = PLACES.indexOf(p);
  activeId = id; refreshPins();
  $("sheetTitle").textContent = `${i + 1}. ${p.name}`;
  const meta = [p.nl !== p.name ? p.nl : null, p.built];
  if (me) { const d = distM(me, p); meta.push(`${fmtDist(d)} · ${walkMin(d)} min walk`); }
  $("sheetMeta").innerHTML = meta.filter(Boolean).map(m => `<span>${m}</span>`).join("");
  const isVisited = visited.has(id);
  $("sheetBody").innerHTML =
    p.text.map(t => `<p>${t}</p>`).join("") +
    `<div class="fact">${p.fact}</div>
     <div class="actions">
       <button class="btn" id="visitBtn">${isVisited ? "✓ Visited" : "Mark as visited"}</button>
       ${walkBtn(p.id)}
       <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${p.lat},${p.lng}">Directions</a>
     </div>`;
  $("sheetBody").scrollTop = 0;
  $("visitBtn").onclick = () => {
    visited.has(id) ? visited.delete(id) : visited.add(id);
    saveVisited(); openPlace(id);
  };
  map.panTo([p.lat, p.lng], { animate: true });
  openSheet();
}

function openList() {
  activeId = null; refreshPins();
  $("sheetTitle").textContent = "Places to discover";
  $("sheetMeta").innerHTML = `<span>${visited.size} of ${PLACES.length} visited</span>${me ? "<span>Nearest first</span>" : ""}`;
  const items = PLACES.map((p, i) => ({ p, i, d: me ? distM(me, p) : null }));
  if (me) items.sort((a, b) => a.d - b.d);
  $("sheetBody").innerHTML = `<ul class="list">${items.map(({ p, i, d }) => `
    <li><button data-id="${p.id}">
      <span class="num ${visited.has(p.id) ? "visited" : ""}">${i + 1}</span>
      <span class="li-text"><strong>${p.name}</strong><span>${p.built}</span></span>
      ${d != null ? `<span class="dist">${fmtDist(d)}</span>` : ""}
    </button></li>`).join("")}</ul>`;
  $("sheetBody").querySelectorAll("button[data-id]").forEach(b => b.onclick = () => openPlace(b.dataset.id));
  $("sheetBody").scrollTop = 0;
  openSheet();
}

// Heritage layers from the Flemish heritage inventory: beluiken and Mary statues

let showSights = true, showGone = false;
const docs = new Map();          // id -> documentation record (IndexedDB)

const CATS = {
  beluik: {
    file: "data/beluiken.json", label: "Beluiken", noun: "beluik", show: true,
    pin: "bpin", dot: "bnum", data: [], markers: {}, layer: L.layerGroup().addTo(map),
    blurb: "workers' courtyards",
    intro: "Beluiken are courtyards of small workers' houses that factory owners and speculators built behind street façades during Ghent's textile boom in the 19th century. Many were cleared as slums in the 20th century; the ones left are a unique part of the city.",
    states: ["", "Intact", "Renovated", "Partly demolished", "Demolished", "Rebuilt / new houses"],
    features: [["pump", "Water pump"], ["toilets", "Shared toilets"], ["chapel", "Wall chapel / Mary statue"], ["gate", "Entrance gate / poortje"], ["cobbles", "Cobbles"], ["washhouse", "Wash house"]],
    count: true, notesLabel: "Notes (architecture, changes, dates on façades…)",
  },
  maria: {
    file: "data/maria.json", label: "Mary statues", noun: "Mary statue", show: true,
    pin: "mpin", dot: "mnum", data: [], markers: {}, layer: L.layerGroup().addTo(map),
    blurb: "statues and niches in the streets",
    intro: "Statues of Mary watch over many Ghent street corners, façades and beluik courtyards. Neighbours often placed them in a niche or a small wooden wall chapel (kastkapel) and kept them decorated with flowers and candles, especially in May, the month of Mary.",
    states: ["", "Statue in place", "Copy / replacement", "Damaged", "Empty niche", "Gone"],
    features: [["niche", "In a façade niche"], ["corner", "On a corner house"], ["kastkapel", "Wooden wall chapel"], ["inbeluik", "Inside a beluik"], ["flowers", "Flowers or candles"], ["lantern", "Lantern"], ["inscription", "Inscription / prayer"]],
    count: false, notesLabel: "Notes (material, colours, inscription, who looks after it…)",
  },
};
const catOf = rec => (rec && rec.cat) || "beluik";

// ---- IndexedDB ----
const DB = (() => {
  let dbp;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open("ghentwalk", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id" });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("docs", mode); const st = t.objectStore("docs");
      const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  }
  return {
    all: () => tx("readonly", st => st.getAll()),
    put: rec => tx("readwrite", st => st.put(rec)),
    del: id => tx("readwrite", st => st.delete(id)),
  };
})();

function getDoc(id) {
  return docs.get(id) || { id, notes: "", houses: "", state: "", features: [], stories: "", photos: [], home: false };
}
function hasDoc(d) { return d && (d.notes || d.stories || d.houses || d.state || (d.features || []).length || (d.photos || []).length || d.home); }
let saveTimer;
async function saveDoc(rec, quiet) {
  rec.updated = new Date().toISOString();
  docs.set(rec.id, rec);
  try { await DB.put(rec); if (!quiet) flashSaved(); } catch (e) { status("Couldn't save on this device: " + e.message, 6000); }
  refreshBPins();
}
function flashSaved() { const el = document.getElementById("savedNote"); if (el) el.textContent = "Saved on this phone · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

// ---- data ----
function allOf(cat) {
  const custom = [...docs.values()].filter(d => d.custom && catOf(d) === cat).map(d => ({
    id: d.id, cat, name: d.name || "My " + CATS[cat].noun, address: d.address || "", lat: d.lat, lng: d.lng,
    preserved: true, custom: true, period: "", description: "", url: null,
  }));
  return CATS[cat].data.concat(custom);
}
function findItem(id) {
  for (const cat in CATS) { const it = allOf(cat).find(x => x.id === id); if (it) return it; }
}
function pinClass(b) {
  const d = docs.get(b.id);
  return [CATS[b.cat].pin, b.preserved ? "" : "gone", b.custom ? "custom" : "", d && d.home ? "home" : "",
          hasDoc(d) ? "doc" : "", activeId === b.id ? "active" : ""].join(" ");
}
function bIcon(b) {
  const big = docs.get(b.id)?.home;
  return L.divIcon({ className: "", html: `<div class="${pinClass(b)}"></div>`, iconSize: big ? [22, 22] : [18, 18], iconAnchor: big ? [11, 11] : [9, 9] });
}
function refreshBPins() {
  for (const cat in CATS) {
    const C = CATS[cat];
    C.layer.clearLayers();
    if (!C.show) continue;
    allOf(cat).forEach(b => {
      if (b.lat == null) return;
      if (!b.preserved && !showGone && !hasDoc(docs.get(b.id))) return;
      const m = C.markers[b.id] || (C.markers[b.id] = L.marker([b.lat, b.lng], { title: b.name, keyboard: true }).on("click", () => openBeluik(b.id)));
      m.setLatLng([b.lat, b.lng]).setIcon(bIcon(b)).addTo(C.layer);
    });
  }
}
function prettyPeriod(p) {
  return (p || "").replace(/eerste kwart/g, "1st quarter").replace(/tweede kwart/g, "2nd quarter")
    .replace(/derde kwart/g, "3rd quarter").replace(/vierde kwart/g, "4th quarter")
    .replace(/eerste helft/g, "1st half").replace(/tweede helft/g, "2nd half")
    .replace(/(\d+)de eeuw/g, "$1th c.").replace(/voor WO I/g, "before WWI").replace(/interbellum/g, "interwar")
    .replace(/na WO II/g, "after WWII").replace(/WO II\b/g, "WWII").replace(/WO I\b/g, "WWI");
}
function kindOf(name) {
  const n = name.toLowerCase();
  if (n.includes("pleinbeluik")) return "Square courtyard (pleinbeluik): houses around a small shared square";
  if (n.includes("steegbeluik") || n.includes("steeg")) return "Alley courtyard (steegbeluik): a row of houses along a narrow shared alley";
  if (n.includes("stratenbeluik") || n.includes("straatbeluik")) return "Street courtyard (straatbeluik): a private street lined with workers' houses";
  return "";
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NL = { gemakhuisjes: "shared toilets", kastkapellen: "wall chapels", waterpompen: "water pumps", kasseiwegen: "cobbled lanes",
  arbeiderswoningen: "workers' houses", stadswoningen: "town houses", werkplaatsen: "workshops", opslagplaatsen: "warehouses",
  "poorten (bijgebouwen)": "gateway", washuizen: "wash houses", blekerijen: "bleachery", palen: "bollards", winkels: "shops",
  achterhuizen: "back houses", burgerhuizen: "bourgeois houses", stallen: "stables", hoeven: "farmhouse", weverijen: "weaving mill",
  katoenfabrieken: "cotton mill", Mariagrotten: "Lourdes grotto", hekken: "gates", godshuizen: "almshouses", beluiken: "beluik",
  niskapellen: "niche chapel", "kapellen (klein erfgoed)": "small chapel", "kapellen (gebouwen en structuren)": "chapel",
  hoekhuizen: "corner house", herenhuizen: "mansion", kerken: "church", kloosters: "convent", beelden: "statues" };

async function loadLayers() {
  try { (await DB.all()).forEach(d => docs.set(d.id, d)); } catch (e) {}
  await Promise.all(Object.entries(CATS).map(async ([cat, C]) => {
    try {
      const r = await fetch(C.file, { cache: "no-cache" });
      if (r.ok) C.data = ((await r.json()).items || []).map(x => ({ ...x, cat }));
    } catch (e) {}
  }));
  if (!CATS.beluik.data.length) status("Couldn't load the heritage lists. Check your connection.", 6000);
  refreshBPins();
}

// ---- card ----
function openBeluik(id) {
  const b = findItem(id); if (!b) return;
  const C = CATS[b.cat];
  const d = getDoc(id);
  activeId = id; refreshPins(); refreshBPins();
  $("sheetTitle").textContent = b.name;
  const meta = [b.address];
  if (me && b.lat != null) { const dist = distM(me, b); meta.push(`${fmtDist(dist)} · ${walkMin(dist)} min walk`); }
  $("sheetMeta").innerHTML = meta.filter(Boolean).map(m => `<span>${esc(m)}</span>`).join("");
  const tags = [`<span class="tag">${C.noun}</span>`];
  if (b.custom) tags.push('<span class="tag">Added by you</span>');
  else tags.push(b.preserved ? '<span class="tag ok">Still there</span>' : '<span class="tag gone">Gone</span>');
  if (b.protected) tags.push('<span class="tag prot">Protected monument</span>');
  else if (b.established) tags.push('<span class="tag">Listed heritage</span>');
  if (d.home) tags.push('<span class="tag prot">My home</span>');
  const facts = [];
  const kind = b.cat === "beluik" ? kindOf(b.name) : ""; if (kind) facts.push(["Type", kind]);
  if (b.period) facts.push(["Built", prettyPeriod(b.period)]);
  if (b.deelgemeente && b.deelgemeente !== "Gent") facts.push(["District", b.deelgemeente]);
  if (b.designer) facts.push([b.cat === "maria" ? "Makers" : "Designer", b.designer]);
  if (b.style) facts.push(["Style", b.style]);

const photoURLs = [];
function renderPhotos(rec) {

  }).join("");

    rec.photos.splice(+btn.dataset.i, 1); saveDoc(rec); renderPhotos(rec);

// Downscale photos so hundreds fit on the phone
function shrink(file, max = 1800) {
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => (b ? res(b) : rej(new Error("photo"))), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); res(file); };
    img.src = u;
  });
}

// Shops from OpenStreetMap: night shops and geek stores
// =====================================================================
const DAYS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
// Small opening_hours reader for the common forms ("Mo-Su 16:00-02:00; Fr,Sa 16:00-04:00", "24/7").
// Returns true/false, or null when the text is too unusual to read.
function openNow(oh, now = new Date()) {
  if (!oh) return null;
  if (oh.trim() === "24/7") return true;
  const mins = d => d.getHours() * 60 + d.getMinutes();
  const dayIdx = d => d.getDay();
  let result = null;
  const dayMatch = (spec, day) => spec.split(",").some(part => {
    const [a, b] = part.trim().split("-");
    const ia = DAYS.indexOf(a), ib = b ? DAYS.indexOf(b) : ia;
    if (ia < 0 || ib < 0) throw new Error("day");
    return ia <= ib ? day >= ia && day <= ib : day >= ia || day <= ib;
  });
  try {
    for (const rule of oh.split(";").map(r => r.trim()).filter(Boolean)) {
      const m = rule.match(/^([A-Za-z,\- ]+?)?\s*((?:\d{1,2}:\d{2}-\d{1,2}:\d{2}\+?,?\s*)+|off|closed)$/);
      if (!m) return null;
      const spec = (m[1] || "Mo-Su").trim(); const times = m[2];
      if (/PH|SH/.test(spec)) continue;
      const today = dayIdx(now), yesterday = (today + 6) % 7, t = mins(now);
      let applies = false, open = false;
      if (dayMatch(spec, today)) { applies = true; }
      if (times === "off" || times === "closed") { if (applies) result = false; continue; }
      for (const rng of times.split(",").map(x => x.trim()).filter(Boolean)) {
        const [s, e] = rng.replace("+", "").split("-").map(x => { const [h, mm] = x.split(":"); return +h * 60 + +mm; });
        const overnight = e <= s;
        if (applies && (overnight ? t >= s : t >= s && t < e)) open = true;
        if (overnight && dayMatch(spec, yesterday) && t < e) { open = true; applies = true; }
      }
      if (applies) result = open;   // later rules override earlier ones, as in the spec
    }
    return result === null ? false : result;
  } catch (e) { return null; }
}

  { key: "beluik", label: "Beluiken", sub: () => `${allOf("beluik").length} workers' courtyards`, dot: "bnum", on: () => CATS.beluik.show, flip: () => toggle("beluik") },
  { key: "maria", label: "Mary statues", sub: () => `${allOf("maria").length} statues and wall chapels`, dot: "mnum", on: () => CATS.maria.show, flip: () => toggle("maria") },
  { key: "night", label: "Night shops", sub: () => `${POI.night.data.length} shops · purple = open now`, dot: "nnum open", on: () => POI.night.show, flip: () => togglePoi("night") },
  { key: "geek", label: "Geek stores", sub: () => `${POI.geek.data.length} comic, manga & game shops`, dot: "gnum", on: () => POI.geek.show, flip: () => togglePoi("geek") },
];
const GONE = { key: "gone", label: "Show what's gone", sub: () => "Demolished beluiken and lost statues", on: () => showGone, flip: () => toggle("gone") };
const PREF_KEY = "ghentwalk.layers";
function savePrefs() {
  const p = {}; [...LAYERS, GONE].forEach(l => (p[l.key] = l.on()));
  try { localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch (e) {}
}
(function loadPrefs() {
  let p = null; try { p = JSON.parse(localStorage.getItem(PREF_KEY) || "null"); } catch (e) {}
  if (p) [...LAYERS, GONE].forEach(l => { if (typeof p[l.key] === "boolean" && p[l.key] !== l.on()) l.flip(); });
})();

// One search across every layer
let searchQ = "";
function everything() {
  const out = PLACES.map((p, i) => ({ id: p.id, name: p.name, sub: "Sight · " + (p.nl !== p.name ? p.nl : p.built), lat: p.lat, lng: p.lng, dot: "num", label: String(i + 1), open: () => openPlace(p.id) }));
  for (const cat in CATS) allOf(cat).forEach(b => out.push({ id: b.id, name: b.name, sub: CATS[cat].noun[0].toUpperCase() + CATS[cat].noun.slice(1) + " · " + b.address, lat: b.lat, lng: b.lng,
    dot: `${CATS[cat].dot} ${b.preserved ? "" : "gone"}`, label: "", open: () => openBeluik(b.id) }));
  for (const cat in POI) POI[cat].data.forEach(s => out.push({ id: s.id, name: s.name, sub: [s.kind || POI[cat].noun, s.address].filter(Boolean).join(" · "),
    lat: s.lat, lng: s.lng, dot: POI[cat].dot + (POI[cat].hours && openNow(s.opening_hours) === true ? " open" : ""), label: "",
    open: () => { if (!POI[cat].show) { togglePoi(cat); savePrefs(); } openPoi(cat, s.id); } }));
  return out;
}
function openSearch() {

  $("sheetTitle").textContent = "Search";

  $("sheetBody").innerHTML = `

        ${Object.entries(POI).map(([cat, C]) => `<li><button data-poi="${cat}"><span class="${C.dot} open"></span><span class="li-text"><strong>${C.label}</strong><span>${C.data.length} ${C.blurb}</span></span></button></li>`).join("")}
      </ul>

      <ul class="list"><li><button id="goWalk"><span class="stopnum static">↝</span><span class="li-text"><strong>Plan a walk</strong><span>${walk.stops.length ? walk.stops.length + " stops picked" : "Pick places, get the shortest route, be guided"}</span></span></button></li></ul>
      <div class="group-h">My documentation</div>
      <div class="row-actions"><button class="btn" id="exportBtn">Export</button><button class="btn" id="importBtn">Import</button></div>
      <p class="saved">Long-press the map to add a beluik or Mary statue that's missing. Notes and photos stay on this phone until you export them.</p>`;
      R.querySelector('[data-go="sights"]').onclick = openList;
      R.querySelectorAll("button[data-go]:not([data-go=sights])").forEach(x => x.onclick = () => openBList(x.dataset.go));
      R.querySelectorAll("button[data-poi]").forEach(x => x.onclick = () => openPoiList(x.dataset.poi));
      $("exportBtn").onclick = exportDocs; $("importBtn").onclick = () => $("importFile").click();
      $("goWalk").onclick = openWalk;
      return;
    }
    const words = q.split(/\s+/);
    let hits = everything().filter(x => words.every(w => (x.name + " " + (x.sub || "")).toLowerCase().includes(w)));
    hits = hits.map(x => ({ x, d: me && x.lat != null ? distM(me, x) : null }))
      .sort((a, b) => (a.d != null && b.d != null ? a.d - b.d : a.x.name.localeCompare(b.x.name))).slice(0, 60);
    R.innerHTML = hits.length ? `<ul class="list">${hits.map(({ x, d }, i) => `<li><button data-k="${i}"><span class="${x.dot}">${x.label}</span>

  };

  $("sheetBody").scrollTop = 0;
  openSheet();
}

// =====================================================================
// Walks: pick stops, get the shortest walking order, be guided live
// =====================================================================
const WALK_KEY = "ghentwalk.walk";
const ROUTER = "https://routing.openstreetmap.de/routed-foot";   // OSRM with a walking profile (FOSSGIS)
let walk = { stops: [], fromMe: true, back: false };
try { walk = Object.assign(walk, JSON.parse(localStorage.getItem(WALK_KEY) || "{}")); } catch (e) {}
const saveWalk = () => { try { localStorage.setItem(WALK_KEY, JSON.stringify({ stops: walk.stops, fromMe: walk.fromMe, back: walk.back })); } catch (e) {} };
let route = null;          // { order: [stop], line: [[lat,lng]], legs: [{distance,duration,steps}], distance, duration, street: bool }
let guide = null;          // { i: index of next stop in route.order, step: step index in current leg }
const routeLayer = L.layerGroup().addTo(map);

function walkItem(id) {
  const p = PLACES.find(x => x.id === id);
  if (p) return { id, name: p.name, lat: p.lat, lng: p.lng, kind: "Sight" };
  const b = findItem(id);
  if (b) return { id, name: b.name, lat: b.lat, lng: b.lng, kind: CATS[b.cat].noun };
  for (const cat in POI) { const s = POI[cat].data.find(x => x.id === id); if (s) return { id, name: s.name, lat: s.lat, lng: s.lng, kind: POI[cat].noun }; }
}
const inWalk = id => walk.stops.some(s => s.id === id);
function walkBtn(id) {
  return `<button class="btn ${inWalk(id) ? "" : "primary"}" data-walk="${esc(id)}" style="box-shadow:none">${inWalk(id) ? "✓ In your walk" : "＋ Add to walk"}</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-walk]"); if (!b) return;
  const id = b.dataset.walk;
  if (inWalk(id)) walk.stops = walk.stops.filter(s => s.id !== id);
  else { const it = walkItem(id); if (it && it.lat != null) walk.stops.push(it); }
  saveWalk(); clearRoute(); updateWalkPill();
  b.outerHTML = walkBtn(id);
  status(inWalk(id) ? `Added · ${walk.stops.length} stop${walk.stops.length === 1 ? "" : "s"} in your walk` : "Removed from your walk", 2200);
});

function updateWalkPill() {
  const pill = $("walkPill");
  pill.hidden = !walk.stops.length || !!guide;
  pill.querySelector("span").textContent = route ? `Walk · ${fmtDist(route.distance)} · ${Math.round(route.duration / 60)} min` : `Your walk · ${walk.stops.length} stop${walk.stops.length === 1 ? "" : "s"}`;
}
function clearRoute() { route = null; routeLayer.clearLayers(); }

// ---- ordering ----
// Without the routing service: nearest-neighbour start, improved with 2-opt, on straight-line distances.
function orderLocally(start, stops, back) {
  const pts = start ? [start, ...stops] : stops.slice();
  const n = pts.length; if (n < 3 && !back) return stops.slice();
  const D = pts.map(a => pts.map(b => distM(a, b)));
  let tour = [0], left = new Set(pts.map((_, i) => i).slice(1));
  while (left.size) { const last = tour[tour.length - 1]; let best = null; for (const j of left) if (best == null || D[last][j] < D[last][best]) best = j; tour.push(best); left.delete(best); }
  const len = t => t.reduce((s, v, k) => s + (k ? D[t[k - 1]][v] : 0), 0) + (back ? D[t[t.length - 1]][t[0]] : 0);
  let improved = true;
  while (improved) {
    improved = false;
    for (let a = 1; a < n - 1; a++) for (let b = a + 1; b < n; b++) {
      const t = tour.slice(0, a).concat(tour.slice(a, b + 1).reverse(), tour.slice(b + 1));
      if (len(t) + 0.01 < len(tour)) { tour = t; improved = true; }
    }
  }
  const ordered = tour.map(i => pts[i]);
  return start ? ordered.slice(1) : ordered;
}

async function planRoute() {
  if (!walk.stops.length) return;
  const start = walk.fromMe && me ? { id: "me", name: "Your location", lat: me.lat, lng: me.lng } : null;
  if (!start && walk.stops.length < 2) { status("Add one more stop, or turn on Locate me to start from where you are.", 4000); return; }
  status("Finding the shortest walk…", 0);
  const pts = start ? [start, ...walk.stops] : walk.stops.slice();
  try {
    const coords = pts.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(";");
    const url = `${ROUTER}/trip/v1/foot/${coords}?source=first&roundtrip=${walk.back}${walk.back ? "" : "&destination=any"}&geometries=geojson&overview=full&steps=true`;
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(url, { signal: ctl.signal }); clearTimeout(timer);
    const j = await r.json();
    if (j.code !== "Ok") throw new Error(j.message || j.code);
    const t = j.trips[0];
    const order = j.waypoints.map((w, i) => ({ p: pts[i], k: w.waypoint_index })).sort((a, b) => a.k - b.k).map(x => x.p);
    route = { order: order.filter(p => p.id !== "me"), start, line: t.geometry.coordinates.map(c => [c[1], c[0]]),
              legs: [null, ...t.legs], distance: t.distance, duration: t.duration, street: true };
    if (start) route.legs = t.legs;   // legs[0] runs from you to the first stop
  } catch (e) {
    const order = orderLocally(start, walk.stops, walk.back);
    const chain = (start ? [start] : []).concat(order, walk.back ? [start || order[0]] : []);
    let dist = 0; for (let k = 1; k < chain.length; k++) dist += distM(chain[k - 1], chain[k]) * 1.3;   // streets are ~30% longer than a straight line
    route = { order, start, line: chain.map(p => [p.lat, p.lng]), legs: [], distance: dist, duration: dist / 1.3, street: false };
  }
  drawRoute(); updateWalkPill();
  $("status").hidden = true;
  if (!route.street) status("Couldn't reach the route service, so the order is based on straight lines.", 5000);
}
function drawRoute() {
  routeLayer.clearLayers(); if (!route) return;
  L.polyline(route.line, { color: getComputedStyle(document.documentElement).getPropertyValue("--route").trim() || "#d2462b", weight: 6, opacity: .85, dashArray: route.street ? null : "8 10" }).addTo(routeLayer);
  route.order.forEach((p, i) => L.marker([p.lat, p.lng], { interactive: false, zIndexOffset: 900,
    icon: L.divIcon({ className: "", html: `<div class="stopnum ${guide && i < guide.i ? "done" : ""}">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(routeLayer));
  map.fitBounds(L.latLngBounds(route.line).pad(0.15), { paddingBottomRight: [0, 260] });
}

// ---- walk sheet ----
function openWalk() {
  activeId = null; refreshPins(); refreshBPins(); refreshNPins();
  const list = route ? route.order : walk.stops;
  $("sheetTitle").textContent = "Your walk";
  $("sheetMeta").innerHTML = route
    ? `<span>${route.order.length} stops</span><span>${fmtDist(route.distance)}</span><span>about ${Math.round(route.duration / 60)} min walking</span>`
    : `<span>${walk.stops.length} stop${walk.stops.length === 1 ? "" : "s"}</span><span>Order not planned yet</span>`;
  $("sheetBody").innerHTML = walk.stops.length ? `
    <ul class="list">${list.map((s, i) => `<li><button data-open="${esc(s.id)}"><span class="stopnum static">${route ? i + 1 : "•"}</span>
      <span class="li-text"><strong>${esc(s.name)}</strong><span>${esc(s.kind)}</span></span>
      <span class="dist" data-rm="${esc(s.id)}" role="button" aria-label="Remove ${esc(s.name)}">✕</span></button></li>`).join("")}</ul>
    <div class="checks" style="margin:12px 0">
      <label><input type="checkbox" id="w-me" ${walk.fromMe ? "checked" : ""}> Start from my location</label>
      <label><input type="checkbox" id="w-back" ${walk.back ? "checked" : ""}> Return to the start</label>
    </div>
    <div class="row-actions">
      <button class="btn primary" id="w-plan" style="box-shadow:none">${route ? "Re-plan" : "Find the shortest route"}</button>
      ${route ? `<button class="btn primary" id="w-go" style="box-shadow:none;background:var(--accent-2)">▶ Start guiding</button>` : ""}
      <button class="btn" id="w-clear">Clear walk</button>
    </div>
    <p class="saved">${route && !route.street ? "Straight-line estimate; the real path follows the streets. " : ""}Add stops with “＋ Add to walk” on any card, or from Search.</p>`
    : `<p style="color:var(--muted);line-height:1.6">Your walk is empty. Open any sight, beluik, Mary statue or shop and tap <b>＋ Add to walk</b>. Then come back here to get the shortest route and be guided along it.</p>
       <div class="row-actions"><button class="btn primary" id="w-search" style="box-shadow:none">Search places to add</button></div>`;
  const B = $("sheetBody");
  B.querySelectorAll("[data-open]").forEach(x => x.onclick = e => {
    if (e.target.dataset.rm) { walk.stops = walk.stops.filter(s => s.id !== e.target.dataset.rm); saveWalk(); clearRoute(); updateWalkPill(); return openWalk(); }
    const id = x.dataset.open; if (PLACES.some(p => p.id === id)) openPlace(id); else if (findItem(id)) openBeluik(id); else for (const c in POI) if (POI[c].data.some(s => s.id === id)) openPoi(c, id);
  });
  if (!walk.stops.length) { $("w-search").onclick = openSearch; return openSheet(); }
  $("w-me").onchange = e => { walk.fromMe = e.target.checked; saveWalk(); clearRoute(); updateWalkPill(); openWalk(); };
  $("w-back").onchange = e => { walk.back = e.target.checked; saveWalk(); clearRoute(); updateWalkPill(); openWalk(); };
  $("w-plan").onclick = async () => {
    if (walk.fromMe && !me) { $("locateBtn").click(); await new Promise(r => setTimeout(r, 2500)); }
    await planRoute(); openWalk();
  };
  $("w-clear").onclick = e => { if (e.target.dataset.c !== "1") { e.target.dataset.c = "1"; e.target.textContent = "Tap again to clear"; return; } walk.stops = []; saveWalk(); clearRoute(); updateWalkPill(); closeSheet(); };
  if ($("w-go")) $("w-go").onclick = startGuide;
  openSheet();
}
$("walkPill").onclick = openWalk;

// ---- live guidance ----
let wakeLock = null;
async function startGuide() {
  if (!route || !route.order.length) return;
  guide = { i: 0, step: 0, arrivedAt: {} };
  closeSheet(); updateWalkPill(); drawRoute();
  $("guide").hidden = false;
  if (!me || watchId == null) $("locateBtn").click();
  follow = true; $("locateBtn").classList.add("on");
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  if (me) map.setView([me.lat, me.lng], 17);
  renderGuide();
}
function stopGuide(done) {
  guide = null; $("guide").hidden = true;
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  drawRoute(); updateWalkPill();
  if (done) status("Walk finished. Well walked!", 5000);
}
const ARRIVE_M = 30;
function stepText(st) {
  if (!st) return "";
  const m = st.maneuver || {}, mod = (m.modifier || "").replace("slight ", "slightly ").replace("sharp ", "sharp ");
  const onto = st.name ? ` onto ${st.name}` : "";
  switch (m.type) {
    case "depart": return `Head off${st.name ? " along " + st.name : ""}`;
    case "arrive": return "You're arriving";
    case "roundabout": case "rotary": return `At the roundabout, take exit ${m.exit || ""}${onto}`;
    case "continue": case "new name": return `Continue${onto || " straight on"}`;
    default: return mod === "straight" ? `Go straight${onto}` : mod ? `Turn ${mod}${onto}` : `Continue${onto}`;
  }
}
function renderGuide() {
  if (!guide || !route) return;
  const next = route.order[guide.i];
  const d = me ? distM(me, next) : null;
  const leg = route.legs[guide.i];
  let turn = "";
  if (leg && leg.steps && me) {
    // advance past steps whose turn point we've reached
    while (guide.step < leg.steps.length - 1) {
      const loc = leg.steps[guide.step + 1].maneuver.location;
      if (distM(me, { lat: loc[1], lng: loc[0] }) < 18) guide.step++; else break;
    }
    const up = leg.steps[guide.step + 1] || leg.steps[guide.step];
    if (up) {
      const loc = up.maneuver.location; const dd = distM(me, { lat: loc[1], lng: loc[0] });
      turn = up.maneuver.type === "arrive" ? "" : `In ${fmtDist(dd)}: ${stepText(up)}`;
    }
  }
  $("g-count").textContent = `Stop ${guide.i + 1} of ${route.order.length}`;
  $("g-name").textContent = next.name;
  $("g-dist").textContent = d != null ? `${fmtDist(d)} · ${walkMin(d * (route.street ? 1.2 : 1.3))} min` : "Waiting for your location…";
  $("g-turn").textContent = turn;
  $("g-turn").hidden = !turn;
  if (d != null && d < ARRIVE_M && !guide.arrivedAt[guide.i]) arrive();
}
function arrive() {
  const stop = route.order[guide.i];
  guide.arrivedAt[guide.i] = Date.now();
  try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
  if (PLACES.some(p => p.id === stop.id)) { visited.add(stop.id); saveVisited(); refreshPins(); }
  status(`You've reached ${stop.name}`, 3500);
  // show its story, then move on to the next stop
  if (PLACES.some(p => p.id === stop.id)) openPlace(stop.id);
  else if (findItem(stop.id)) openBeluik(stop.id);
  else for (const c in POI) if (POI[c].data.some(s => s.id === stop.id)) openPoi(c, stop.id);
  nextStop();
}
function nextStop() {
  if (!guide) return;
  if (guide.i >= route.order.length - 1) { stopGuide(true); return; }
  guide.i++; guide.step = 0; drawRoute(); renderGuide();
}
$("g-skip").onclick = () => { guide.arrivedAt[guide.i] = Date.now(); nextStop(); };
$("g-stop").onclick = () => stopGuide(false);
$("g-list").onclick = openWalk;
document.addEventListener("visibilitychange", async () => { if (guide && document.visibilityState === "visible") { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {} } });
updateWalkPill();

// ---- location ----
const meIcon = L.divIcon({ className: "", html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
function onPos(pos) {
  const first = !me;
  me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
  if (typeof renderGuide === "function" && guide) setTimeout(renderGuide, 0);
  const ll = [me.lat, me.lng];
  if (!meMarker) {
    meMarker = L.marker(ll, { icon: meIcon, zIndexOffset: 1000, title: "You are here" }).addTo(map);
    meCircle = L.circle(ll, { radius: pos.coords.accuracy, color: "#1a73e8", weight: 1, fillOpacity: .08 }).addTo(map);
  } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(pos.coords.accuracy); }
  if (first || follow) {
    const nearest = PLACES.reduce((a, p) => (distM(me, p) < distM(me, a) ? p : a));
    if (first) {
      const dCentre = distM(me, { lat: 51.0545, lng: 3.7235 });
      if (dCentre > 15000) status("You seem to be outside Ghent. The map stays on the city centre.", 6000);
      else { map.setView(ll, 17); status(`Nearest sight: ${nearest.name}, ${fmtDist(distM(me, nearest))}`, 3000); }
    } else map.panTo(ll);
  }
}
function onErr(err) {
  const msg = err.code === 1
    ? "Location is blocked. Allow location for this page in your browser settings and try again."
    : "Couldn't find your location. Check that GPS is on and try again.";
  status(msg, 7000);
}
$("locateBtn").onclick = () => {
  if (!("geolocation" in navigator)) { status("This browser can't share your location."); return; }
  follow = true; $("locateBtn").classList.add("on");
  if (me) map.setView([me.lat, me.lng], Math.max(map.getZoom(), 17));
  else status("Finding you…", 0);
  if (watchId == null) watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
};
map.on("dragstart", () => { follow = false; $("locateBtn").classList.remove("on"); });
</script>
</body>
</html>
