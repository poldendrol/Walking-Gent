<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ghent Walk</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: full-screen map, floating controls, bottom sheet for stories */
  :root {
    --ink: #1c2730;
    --muted: #5d6b75;
    --paper: #ffffff;
    --wash: #f2f5f6;
    --accent: #b5462b;      /* Ghent brick red */
    --accent-2: #1f3a4d;    /* Lys water blue */
    --line: #dde3e6;
    --green: #2f7d5b;       /* beluik courtyards */
    --gold: #b88a1b;
    --display: "Fraunces", Georgia, serif;
    --body: "Inter", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8edf0; --muted:#a3b0b8; --paper:#1a2329; --wash:#232e35; --line:#33414a; --accent:#e0704f; --accent-2:#8fc1df; --green:#5cb88d; --gold:#d9ad45; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--body); color: var(--ink); background: var(--paper); overflow: hidden; }
  #map { position: absolute; inset: 0; }

  .topbar {
    position: absolute; z-index: 1050; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    display: flex; gap: 8px; align-items: center; pointer-events: none;
  }
  .brand {
    pointer-events: auto; background: var(--paper); border-radius: 12px; padding: 8px 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); font-family: var(--display); font-size: 18px; font-weight: 600;
    color: var(--accent-2);
  }
  .btn { white-space: nowrap; }
  @media (max-width: 380px) { .brand small { display: none; } }
  .brand small { display:block; font-family: var(--body); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
  .spacer { flex: 1; }
  .btn {
    pointer-events: auto; border: 0; cursor: pointer; background: var(--paper); color: var(--ink);
    border-radius: 12px; height: 44px; padding: 0 14px; font: 600 14px var(--body);
    box-shadow: 0 2px 10px rgba(0,0,0,.18); display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: #fff; }

  .status {
    position: absolute; z-index: 1050; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 66px); background: var(--accent-2); color: #fff;
    padding: 8px 14px; border-radius: 20px; font-size: 13px; max-width: calc(100% - 32px); text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
  }

  /* Numbered landmark pins */
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--accent); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
    display: grid; place-items: center;
  }
  .pin span { transform: rotate(45deg); color: #fff; font: 700 12px var(--body); }
  .pin.visited { background: #6b7d88; }
  .pin.active { background: var(--accent-2); }
  .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.25); }

  /* Bottom sheet */
  .sheet {
    position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; max-height: 62%;
    background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.2);
    display: flex; flex-direction: column; transform: translateY(105%); transition: transform .25s ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform: translateY(0); }
  @media (min-width: 760px) {
    .sheet { left: auto; right: 16px; bottom: 16px; top: 80px; width: 400px; max-height: none; border-radius: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  .sheet-head { padding: 10px 16px 6px; display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--line); }
  .grab { position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--line); }
  .sheet-head h2 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 10px 0 2px; text-wrap: balance; }
  .meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 10px; flex-wrap: wrap; }
  .close { margin-left: auto; margin-top: 8px; background: var(--wash); border: 0; border-radius: 50%; width: 36px; height: 36px; font-size: 20px; cursor: pointer; color: var(--ink); flex: none; }
  .sheet-body { overflow-y: auto; padding: 12px 16px 16px; -webkit-overflow-scrolling: touch; }
  .sheet-body p { line-height: 1.6; margin: 0 0 12px; max-width: 65ch; }
  .fact { background: var(--wash); border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .fact b { color: var(--accent); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a, .actions button { text-decoration: none; }
  .actions .btn { box-shadow: none; border: 1px solid var(--line); height: 40px; }

  /* List view */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li button {
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 4px; display: flex; gap: 12px; align-items: center; cursor: pointer; color: var(--ink); font: inherit;
  }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .num.visited { background: #6b7d88; }
  .li-text { min-width: 0; flex: 1; }
  .li-text strong { display: block; font-weight: 600; }
  .li-text span { font-size: 12px; color: var(--muted); }
  .dist { font-size: 13px; color: var(--accent-2); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* Layer chips */
  .chips {
    position: absolute; z-index: 1050; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 74px);
    padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none;
  }
  .chip {
    pointer-events: auto; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 999px; height: 34px; padding: 0 12px; font: 600 13px var(--body); cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,.14);
  }
  .chip[aria-pressed="true"] { background: var(--accent-2); border-color: var(--accent-2); color: var(--paper); }
  .status { top: calc(env(safe-area-inset-top, 0px) + 118px); }

  /* Beluik pins: square = courtyard */
  .bpin { width: 18px; height: 18px; border-radius: 4px; background: var(--green); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); position: relative; }
  .bpin.gone { background: #fff; border: 2px dashed #6b7d88; }
  .bpin.doc::after { content: ""; position: absolute; right: -5px; top: -5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 1.5px solid #fff; }
  .bpin.home { background: var(--accent); width: 22px; height: 22px; }
  .bpin.custom { background: var(--gold); }
  .bpin.active { outline: 3px solid var(--accent-2); outline-offset: 1px; }

  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--wash); color: var(--muted); }
  .tag.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .tag.gone { background: color-mix(in srgb, #6b7d88 18%, transparent); }
  .tag.prot { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 14px; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .desc { white-space: pre-line; font-size: 14px; line-height: 1.6; color: var(--ink); margin-bottom: 14px; }
  h3.sec { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    font: 16px var(--body); color: var(--ink); background: var(--wash); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
  }
  .field textarea { min-height: 90px; resize: vertical; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: var(--wash); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer; color: var(--ink); font-weight: 500; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .photo { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--wash); max-width: 100%; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }
  .saved { font-size: 12px; color: var(--muted); }
  .search { width: 100%; font: 16px var(--body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--wash); color: var(--ink); margin-bottom: 8px; }
  .bnum { flex: none; width: 22px; height: 22px; border-radius: 5px; background: var(--green); }
  .bnum.gone { background: transparent; border: 2px dashed #6b7d88; }
  .bnum.custom { background: var(--gold); }
  .bnum.home { background: var(--accent); }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
  .row-actions .btn { box-shadow: none; border: 1px solid var(--line); height: 40px; text-decoration: none; }

  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-bottom.leaflet-right { margin-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Ghent"></div>

<div class="topbar">
  <div class="brand">Ghent Walk<small>Sights &amp; beluiken</small></div>
  <div class="spacer"></div>
  <button class="btn" id="listBtn" aria-label="Show all places">Places</button>
  <button class="btn primary" id="locateBtn" aria-label="Show where I am">◎ Locate me</button>
</div>
<div class="chips" role="toolbar" aria-label="What to show">
  <button class="chip" id="chipSights" aria-pressed="true">Sights</button>
  <button class="chip" id="chipBeluiken" aria-pressed="true">Beluiken</button>
  <button class="chip" id="chipGone" aria-pressed="false">Demolished too</button>
</div>
<div class="status" id="status" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="grab"></div>
  <div class="sheet-head">
    <div style="min-width:0">
      <h2 id="sheetTitle"></h2>
      <div class="meta" id="sheetMeta"></div>
    </div>
    <button class="close" id="closeBtn" aria-label="Close">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PLACES = [
  { id: "gravensteen", name: "Gravensteen", nl: "Castle of the Counts", built: "1180", lat: 51.0573, lng: 3.7206,
    text: [
      "Philip of Alsace, Count of Flanders, built this stone castle in 1180 on the site of an older wooden fortress. It was meant to protect the count, and just as much to impress and intimidate the proud, rebellious citizens of Ghent.",
      "When the counts moved out in the 14th century, the castle became a courthouse, a mint and a prison, complete with a torture chamber. In the 19th century it was even used as a cotton mill and workers' housing, and the city almost demolished it.",
      "Instead it was bought by the city and restored around 1900, with a fair amount of romantic imagination added to the battlements."],
    fact: "In 1949 students occupied the castle in a protest against a beer price increase. The event is still remembered every year." },
  { id: "belfort", name: "Belfry of Ghent", nl: "Belfort", built: "1313–1380", lat: 51.0537, lng: 3.7248,
    text: [
      "At 91 metres, the Belfry was the symbol of the city's independence from the count and the church. Its bells called citizens together and warned them of fire or attack from the watchmen at the top.",
      "Behind iron doors, the tower kept the secret chest holding Ghent's charters: the privileges the city had won from its rulers.",
      "It is part of the UNESCO World Heritage listing of the belfries of Belgium and France."],
    fact: "A gilded copper <b>dragon</b> has watched over the city from the spire since the 14th century. The one at the top today is a copy; an older one is shown inside." },
  { id: "lakenhalle", name: "Cloth Hall", nl: "Lakenhalle", built: "from 1425", lat: 51.0535, lng: 3.7243,
    text: [
      "Built against the Belfry, this hall is where wool cloth, the product that made medieval Ghent one of the biggest cities of northern Europe, was inspected and traded.",
      "By the time construction started in 1425 the cloth trade was already in decline, and the building was left unfinished for centuries. It was only completed in the early 20th century."],
    fact: "The small building at the back, the <b>Mammelokker</b>, was the jail. Its sculpture shows the Roman legend of a daughter feeding her imprisoned father." },
  { id: "baafs", name: "St Bavo's Cathedral", nl: "Sint-Baafskathedraal", built: "12th–16th c.", lat: 51.0530, lng: 3.7268,
    text: [
      "It started as a parish church dedicated to St John and grew over four centuries from Romanesque to late Gothic. It became the cathedral of the new Diocese of Ghent in 1559 and was renamed after St Bavo.",
      "The future emperor Charles V, born in Ghent in 1500, was baptised here.",
      "Inside hangs the Ghent Altarpiece, the 'Adoration of the Mystic Lamb' by the brothers Hubert and Jan van Eyck, finished in 1432. It is one of the most important paintings in Western art."],
    fact: "The altarpiece is one of the most stolen artworks in history. One panel, the <b>Just Judges</b>, was stolen in 1934 and has never been found; what you see is a copy." },
  { id: "niklaas", name: "St Nicholas' Church", nl: "Sint-Niklaaskerk", built: "13th c.", lat: 51.0545, lng: 3.7225,
    text: [
      "This was the church of the merchants and guilds who traded at the nearby market. It is a prime example of Scheldt Gothic, built from blue-grey stone shipped from Tournai along the river.",
      "Instead of a west tower, it has a central tower above the crossing that doubled as a watchtower until the Belfry was built."],
    fact: "Stand on St Michael's Bridge and you'll see St Nicholas, the Belfry and St Bavo lined up: Ghent's famous <b>three towers</b>." },
  { id: "graslei", name: "Graslei", nl: "Graslei", built: "12th–17th c.", lat: 51.0549, lng: 3.7211,
    text: [
      "This quay was the heart of Ghent's medieval harbour. Ships brought grain here along the Lys, and the guild houses along the water show how rich the trade made the city.",
      "Look for the Koornstapelhuis, a sober Romanesque grain warehouse from around 1200, right next to the ornate Guild House of the Free Boatmen from 1531."],
    fact: "The Free Boatmen had the right to unload ships in Ghent. The 'unfree' boatmen, who lacked that right, built their guild house across the water on the Korenlei." },
  { id: "korenlei", name: "Korenlei", nl: "Korenlei", built: "16th–18th c.", lat: 51.0548, lng: 3.7197,
    text: [
      "The opposite bank of the old harbour. Its baroque and rococo façades are a little younger and grander than those on the Graslei.",
      "The Guild House of the Unfree Boatmen (1739) stands out with its decorated gable topped by a ship."],
    fact: "In the evening the city lights the façades of both quays, part of Ghent's award-winning <b>lighting plan</b>." },
  { id: "michiel", name: "St Michael's Bridge", nl: "Sint-Michielsbrug", built: "1905–1909", lat: 51.0541, lng: 3.7193,
    text: [
      "This stone bridge was built in the run-up to the 1913 World Fair in Ghent, when the city spruced up its historic centre for visitors.",
      "It gives the best view in town: the Graslei and Korenlei on either side and the three towers in a row."],
    fact: "The tall church behind you is <b>St Michael's</b>, whose tower was never finished. Its flat top is the result." },
  { id: "stadhuis", name: "City Hall", nl: "Stadhuis", built: "1519–1600s", lat: 51.0543, lng: 3.7253,
    text: [
      "A building in two minds. The side facing the Hoogpoort is lavish late Gothic, designed in the early 16th century. Money and fashion changed during construction, so the side on the Botermarkt is sober Renaissance.",
      "In 1576 the Pacification of Ghent was signed here: an agreement among the provinces of the Low Countries to unite against Spanish troops."],
    fact: "You can compare the two styles by walking around the corner of the building. They really are glued together." },
  { id: "vleeshuis", name: "Great Butchers' Hall", nl: "Groot Vleeshuis", built: "1406–1419", lat: 51.0566, lng: 3.7213,
    text: [
      "The covered meat market of medieval Ghent. Selling meat was only allowed here, so the guild of butchers could control prices and quality.",
      "Its long timber roof is still original, and Ganda hams hang from the beams. Today it houses a shop and tasting room for East Flemish regional products."],
    fact: "The butchers' guild was hereditary: only sons of butchers could become butchers." },
  { id: "dullegriet", name: "Dulle Griet", nl: "Dulle Griet (Mad Meg)", built: "15th c.", lat: 51.0566, lng: 3.7242,
    text: [
      "A giant wrought-iron siege cannon from the 15th century, weighing over 12 tonnes. It is one of the largest medieval bombards in the world.",
      "It was made to fire stone balls of around 300 kg. Whether it ever did so in battle is uncertain."],
    fact: "Painted bright red and named after a figure from Flemish folklore, a fierce woman who leads an army to plunder hell." },
  { id: "vrijdagmarkt", name: "Friday Market", nl: "Vrijdagmarkt", built: "since 1199", lat: 51.0570, lng: 3.7258,
    text: [
      "For centuries this was Ghent's political stage: rulers were welcomed here, guilds clashed, and executions took place.",
      "The statue in the middle is Jacob van Artevelde, a 14th-century leader who kept Ghent's cloth industry alive during the Hundred Years' War by negotiating with England for wool."],
    fact: "There is still a market here every <b>Friday</b> morning, as there has been for more than 800 years." },
  { id: "patershol", name: "Patershol", nl: "Patershol", built: "medieval", lat: 51.0584, lng: 3.7224,
    text: [
      "A maze of narrow streets just behind the castle where tanners and craftsmen worked, close to the counts' court.",
      "By the 20th century it had become one of the poorest neighbourhoods in Ghent. It was restored from the 1980s and is now known for its restaurants."],
    fact: "The name probably refers to the Carmelite fathers ('paters') whose monastery stood here." },
  { id: "geeraard", name: "Gerald the Devil's Castle", nl: "Geeraard de Duivelsteen", built: "13th c.", lat: 51.0503, lng: 3.7242,
    text: [
      "A rare Romanesque stone fortified house, built for a knight called Gerald. Stone houses like this were a status symbol in a city mostly built of wood.",
      "It later served as an arsenal, a monastery, a school, an asylum and a prison, and now holds the state archives."],
    fact: "Gerald's dark complexion (or his reputation) earned him the nickname <b>'the Devil'</b>, which grew into many local legends." },
  { id: "baafsabdij", name: "St Bavo's Abbey", nl: "Sint-Baafsabdij", built: "7th c. (ruins)", lat: 51.0532, lng: 3.7368,
    text: [
      "Ghent began around two abbeys founded in the 7th century by St Amand. This is one of them.",
      "After Ghent revolted against Charles V in 1539, the emperor punished his own birthplace: he had much of the abbey demolished to build a fortress to keep the city in check. The romantic ruins of the cloister survive."],
    fact: "As part of that punishment, city leaders had to walk barefoot with a noose around their neck. Ghent residents are still nicknamed the <b>'Stroppendragers'</b>, the noose-bearers." },
  { id: "prinsenhof", name: "Prinsenhof & Dark Gate", nl: "Prinsenhof / Donkere Poort", built: "14th c.", lat: 51.0588, lng: 3.7182,
    text: [
      "The Prinsenhof was a huge palace of the Dukes of Burgundy. Here, in 1500, Charles V was born. He would rule an empire on which, it was said, the sun never set.",
      "Almost nothing remains of the palace. The Dark Gate, one of its entrances, still stands in the quiet neighbourhood that kept its name."],
    fact: "A small bronze statue of the young Charles V stands on the Prinsenhof square nearby." },
  { id: "rabot", name: "Rabot", nl: "Rabot", built: "1489–1491", lat: 51.0603, lng: 3.7115,
    text: [
      "A fortified lock gate on the Lieve canal, part of the old city walls. It controlled the water level and guarded the entrance to the city by water.",
      "With its three round-roofed towers it's one of the few remaining pieces of Ghent's medieval defences."],
    fact: "The Lieve was dug in the 13th century to give Ghent its own route to the sea." },
  { id: "begijnhof", name: "Small Beguinage", nl: "Klein Begijnhof", built: "founded 1234", lat: 51.0430, lng: 3.7290,
    text: [
      "Beguines were religious women who lived together without taking permanent vows. They could leave, own property and support themselves by work.",
      "This peaceful enclosed courtyard with its white houses and baroque church is a small walled town of its own. It is part of the UNESCO-listed Flemish beguinages."],
    fact: "It was founded by Countess <b>Joanna of Constantinople</b>, who ruled Flanders in the 13th century." }
];

// ---- state ----
const STORE_KEY = "ghentwalk.visited";
let visited = new Set();
try { visited = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (e) {}
function saveVisited() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...visited])); } catch (e) {} }

let me = null, meMarker = null, meCircle = null, watchId = null, follow = false, activeId = null;

// ---- map ----
const map = L.map("map", { zoomControl: false }).setView([51.0545, 3.7235], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
L.control.zoom({ position: "bottomright" }).addTo(map);

const markers = {};
const sightsLayer = L.layerGroup().addTo(map);
function pinIcon(p, i) {
  const cls = ["pin", visited.has(p.id) ? "visited" : "", activeId === p.id ? "active" : ""].join(" ");
  return L.divIcon({ className: "", html: `<div class="${cls}"><span>${i + 1}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 36] });
}
function refreshPins() { PLACES.forEach((p, i) => markers[p.id].setIcon(pinIcon(p, i))); }
PLACES.forEach((p, i) => {
  markers[p.id] = L.marker([p.lat, p.lng], { icon: pinIcon(p, i), title: p.name, keyboard: true })
    .addTo(sightsLayer).on("click", () => openPlace(p.id));
});

// ---- helpers ----
function distM(a, b) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(m) { return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`; }
function walkMin(m) { return Math.max(1, Math.round(m / 80)); } // ~4.8 km/h
const $ = id => document.getElementById(id);
let statusTimer;
function status(msg, ms = 4000) {
  const s = $("status"); s.textContent = msg; s.hidden = false;
  clearTimeout(statusTimer); if (ms) statusTimer = setTimeout(() => (s.hidden = true), ms);
}

// ---- sheet ----
function openSheet() { $("sheet").classList.add("open"); }
function closeSheet() { $("sheet").classList.remove("open"); activeId = null; refreshPins(); refreshBPins(); }
$("closeBtn").onclick = closeSheet;

function openPlace(id) {
  const p = PLACES.find(x => x.id === id); const i = PLACES.indexOf(p);

  $("sheetTitle").textContent = `${i + 1}. ${p.name}`;
  const meta = [p.nl !== p.name ? p.nl : null, p.built];
  if (me) { const d = distM(me, p); meta.push(`${fmtDist(d)} · ${walkMin(d)} min walk`); }
  $("sheetMeta").innerHTML = meta.filter(Boolean).map(m => `<span>${m}</span>`).join("");
  const isVisited = visited.has(id);
  $("sheetBody").innerHTML =
    p.text.map(t => `<p>${t}</p>`).join("") +

  openSheet();
}

function openList() {

// Beluiken: 19th-century workers' courtyards, from the Flemish heritage inventory
// =====================================================================
let BELUIKEN = [];               // from data/beluiken.json
let showSights = true, showBeluiken = true, showGone = false;
const bMarkers = {};
const beluikLayer = L.layerGroup().addTo(map);
const docs = new Map();          // id -> documentation record (IndexedDB)

// ---- IndexedDB ----
const DB = (() => {
  let dbp;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open("ghentwalk", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id" });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("docs", mode); const st = t.objectStore("docs");
      const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  }
  return {
    all: () => tx("readonly", st => st.getAll()),
    put: rec => tx("readwrite", st => st.put(rec)),
    del: id => tx("readwrite", st => st.delete(id)),
  };
})();

function getDoc(id) {
  return docs.get(id) || { id, notes: "", houses: "", state: "", features: [], stories: "", photos: [], home: false };
}
function hasDoc(d) { return d && (d.notes || d.stories || d.houses || d.state || (d.features || []).length || (d.photos || []).length || d.home); }
let saveTimer;
async function saveDoc(rec, quiet) {
  rec.updated = new Date().toISOString();
  docs.set(rec.id, rec);
  try { await DB.put(rec); if (!quiet) flashSaved(); } catch (e) { status("Couldn't save on this device: " + e.message, 6000); }
  refreshBPins();
}
function flashSaved() { const el = document.getElementById("savedNote"); if (el) el.textContent = "Saved on this phone · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

// ---- data ----
function allBeluiken() {
  const custom = [...docs.values()].filter(d => d.custom).map(d => ({
    id: d.id, name: d.name || "My beluik", address: d.address || "", lat: d.lat, lng: d.lng,
    preserved: true, custom: true, period: d.period || "", description: "", url: null,
  }));
  return BELUIKEN.concat(custom);
}
function bClass(b) {
  const d = docs.get(b.id);
  return ["bpin", b.preserved ? "" : "gone", b.custom ? "custom" : "", d && d.home ? "home" : "",
          hasDoc(d) ? "doc" : "", activeId === b.id ? "active" : ""].join(" ");
}
function bIcon(b) {
  const big = docs.get(b.id)?.home;
  return L.divIcon({ className: "", html: `<div class="${bClass(b)}"></div>`, iconSize: big ? [22, 22] : [18, 18], iconAnchor: big ? [11, 11] : [9, 9] });
}
function refreshBPins() {
  beluikLayer.clearLayers();
  if (!showBeluiken) return;
  allBeluiken().forEach(b => {
    if (b.lat == null) return;
    if (!b.preserved && !showGone && !hasDoc(docs.get(b.id))) return;
    const m = bMarkers[b.id] || (bMarkers[b.id] = L.marker([b.lat, b.lng], { title: b.name, keyboard: true }).on("click", () => openBeluik(b.id)));
    m.setLatLng([b.lat, b.lng]).setIcon(bIcon(b)).addTo(beluikLayer);
  });
}
function prettyPeriod(p) {
  return (p || "").replace(/eerste kwart/g, "1st quarter").replace(/tweede kwart/g, "2nd quarter")
    .replace(/derde kwart/g, "3rd quarter").replace(/vierde kwart/g, "4th quarter")
    .replace(/eerste helft/g, "1st half").replace(/tweede helft/g, "2nd half")
    .replace(/(\d+)de eeuw/g, "$1th c.").replace(/voor WO I/g, "before WWI").replace(/interbellum/g, "interwar").replace(/WO I\b/g, "WWI");
}
function kindOf(name) {
  const n = name.toLowerCase();
  if (n.includes("pleinbeluik")) return "Square courtyard (pleinbeluik): houses around a small shared square";
  if (n.includes("steegbeluik") || n.includes("steeg")) return "Alley courtyard (steegbeluik): a row of houses along a narrow shared alley";
  if (n.includes("stratenbeluik") || n.includes("straatbeluik")) return "Street courtyard (straatbeluik): a private street lined with workers' houses";
  return "";
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadBeluiken() {
  try { (await DB.all()).forEach(d => docs.set(d.id, d)); } catch (e) {}
  try {
    const r = await fetch("data/beluiken.json", { cache: "no-cache" });
    if (r.ok) BELUIKEN = (await r.json()).items || [];
  } catch (e) { status("Couldn't load the beluiken list. Check your connection.", 6000); }
  refreshBPins();
}

// ---- beluik card ----
const FEATURES = [["pump", "Water pump"], ["toilets", "Shared toilets"], ["chapel", "Wall chapel"], ["gate", "Entrance gate / poortje"], ["cobbles", "Cobbles"], ["washhouse", "Wash house"]];
const STATES = ["", "Intact", "Renovated", "Partly demolished", "Demolished", "Rebuilt / new houses"];

function openBeluik(id) {
  const b = allBeluiken().find(x => x.id === id); if (!b) return;
  const d = getDoc(id);
  activeId = id; refreshPins(); refreshBPins();
  $("sheetTitle").textContent = b.name;
  const meta = [b.address];
  if (me && b.lat != null) { const dist = distM(me, b); meta.push(`${fmtDist(dist)} · ${walkMin(dist)} min walk`); }
  $("sheetMeta").innerHTML = meta.filter(Boolean).map(m => `<span>${esc(m)}</span>`).join("");
  const tags = [];
  if (b.custom) tags.push('<span class="tag">Added by you</span>');
  else tags.push(b.preserved ? '<span class="tag ok">Still standing</span>' : '<span class="tag gone">Demolished</span>');
  if (b.protected) tags.push('<span class="tag prot">Protected monument</span>');
  else if (b.established) tags.push('<span class="tag">Listed heritage</span>');
  if (d.home) tags.push('<span class="tag prot">My home</span>');
  const facts = [];
  const kind = kindOf(b.name); if (kind) facts.push(["Type", kind]);
  if (b.period) facts.push(["Built", prettyPeriod(b.period)]);
  if (b.deelgemeente && b.deelgemeente !== "Gent") facts.push(["District", b.deelgemeente]);
  if (b.designer) facts.push(["Designer", b.designer]);
  if (b.style) facts.push(["Style", b.style]);
  const extra = (b.typology || "").split(",").map(t => t.trim()).filter(t => t && t !== "beluiken");
  if (extra.length) facts.push(["Also on site", extra.join(", ")]);

  $("sheetBody").innerHTML = `
    <div class="tags">${tags.join("")}</div>
    ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
    ${b.description ? `<div class="desc">${esc(b.description)}</div>` : ""}
    <div class="row-actions">
      ${b.url ? `<a class="btn" target="_blank" rel="noopener" href="${b.url}">Full inventory entry</a>` : ""}
      ${b.lat != null ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${b.lat},${b.lng}">Directions</a>` : ""}
    </div>

    <h3 class="sec">My documentation</h3>
    <div class="field"><span class="lbl">Photos</span>
      <div class="photos" id="photoGrid"></div>
      <label class="btn primary" style="width:max-content;box-shadow:none" for="photoInput">＋ Add photos</label>
      <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </div>
    <div class="field"><label for="f-state">Current state</label>
      <select id="f-state">${STATES.map(s => `<option ${s === d.state ? "selected" : ""} value="${s}">${s || "Not recorded"}</option>`).join("")}</select></div>
    <div class="field"><label for="f-houses">Number of houses</label>
      <input type="number" inputmode="numeric" min="0" id="f-houses" value="${esc(d.houses)}"></div>
    <div class="field"><span class="lbl">What's still there</span>
      <div class="checks">${FEATURES.map(([k, l]) => `<label><input type="checkbox" data-f="${k}" ${(d.features || []).includes(k) ? "checked" : ""}> ${l}</label>`).join("")}</div></div>
    <div class="field"><label for="f-notes">Notes (architecture, changes, dates on façades…)</label>
      <textarea id="f-notes">${esc(d.notes)}</textarea></div>
    <div class="field"><label for="f-stories">Stories from residents</label>
      <textarea id="f-stories">${esc(d.stories)}</textarea></div>
    ${b.custom ? `<div class="field"><label for="f-name">Name</label><input type="text" id="f-name" value="${esc(b.name)}"></div>
      <div class="field"><label for="f-address">Address</label><input type="text" id="f-address" value="${esc(b.address)}"></div>` : ""}
    <label class="checks" style="margin-bottom:10px"><label><input type="checkbox" id="f-home" ${d.home ? "checked" : ""}> I live here</label></label>
    <div class="saved" id="savedNote">${d.updated ? "Last saved " + new Date(d.updated).toLocaleString() : "Everything you enter is saved on this phone automatically."}</div>
    ${b.custom ? `<div class="row-actions"><button class="btn" id="delCustom">Remove this beluik</button></div>` : ""}
  `;
  $("sheetBody").scrollTop = 0;

  const rec = getDoc(id);
  if (b.custom) Object.assign(rec, docs.get(id));
  const later = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveDoc(rec), 500); };
  $("f-state").onchange = e => { rec.state = e.target.value; saveDoc(rec); };
  $("f-houses").oninput = e => { rec.houses = e.target.value; later(); };
  $("f-notes").oninput = e => { rec.notes = e.target.value; later(); };
  $("f-stories").oninput = e => { rec.stories = e.target.value; later(); };
  $("f-home").onchange = e => { rec.home = e.target.checked; saveDoc(rec); };
  if (b.custom) {
    $("f-name").oninput = e => { rec.name = e.target.value; $("sheetTitle").textContent = rec.name; later(); };
    $("f-address").oninput = e => { rec.address = e.target.value; later(); };
    $("delCustom").onclick = async e => {
      if (e.target.dataset.confirm !== "1") { e.target.dataset.confirm = "1"; e.target.textContent = "Tap again to remove it and its photos"; return; }
      docs.delete(id); await DB.del(id); delete bMarkers[id]; closeSheet();
    };
  }
  $("sheetBody").querySelectorAll("input[data-f]").forEach(cb => cb.onchange = () => {
    rec.features = [...$("sheetBody").querySelectorAll("input[data-f]:checked")].map(x => x.dataset.f); saveDoc(rec);
  });
  renderPhotos(rec);
  $("photoInput").onchange = async e => {
    const files = [...e.target.files]; e.target.value = "";
    status(`Adding ${files.length} photo${files.length > 1 ? "s" : ""}…`, 0);
    for (const f of files) { try { rec.photos = (rec.photos || []).concat([{ blob: await shrink(f), date: new Date().toISOString() }]); } catch (err) {} }
    await saveDoc(rec); renderPhotos(rec); status("Photos saved on this phone", 2500);
  };
  if (b.lat != null) map.panTo([b.lat, b.lng], { animate: true });
  openSheet();
}

const photoURLs = [];
function renderPhotos(rec) {
  photoURLs.splice(0).forEach(u => URL.revokeObjectURL(u));
  const g = $("photoGrid"); if (!g) return;
  g.innerHTML = (rec.photos || []).map((p, i) => {
    const u = URL.createObjectURL(p.blob); photoURLs.push(u);
    return `<div class="photo"><a href="${u}" target="_blank"><img src="${u}" alt="Photo ${i + 1}"></a><button data-i="${i}" aria-label="Delete photo">×</button></div>`;
  }).join("");
  g.querySelectorAll("button[data-i]").forEach(btn => btn.onclick = () => {
    if (btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.textContent = "✓"; btn.style.background = "#b5462b"; return; }
    rec.photos.splice(+btn.dataset.i, 1); saveDoc(rec); renderPhotos(rec);
  });
}
// Downscale photos so hundreds fit on the phone
function shrink(file, max = 1800) {
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => (b ? res(b) : rej(new Error("photo"))), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); res(file); };
    img.src = u;
  });
}

// ---- export / import ----
const blobToData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function exportDocs() {
  const out = [];
  for (const d of docs.values()) {
    if (!hasDoc(d) && !d.custom) continue;
    const b = allBeluiken().find(x => x.id === d.id);
    out.push({ ...d, beluik: b ? { name: b.name, address: b.address, lat: b.lat, lng: b.lng, url: b.url } : null,
      photos: await Promise.all((d.photos || []).map(async p => ({ date: p.date, data: await blobToData(p.blob) }))) });
  }
  if (!out.length) { status("Nothing documented yet. Open a beluik and add notes or photos first."); return; }
  const blob = new Blob([JSON.stringify({ app: "Walking Gent", exported: new Date().toISOString(), records: out }, null, 1)], { type: "application/json" });
  const name = `beluiken-documentation-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Beluiken documentation" }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text()); let n = 0;
    for (const r of data.records || []) {
      const photos = await Promise.all((r.photos || []).map(async p => ({ date: p.date, blob: await (await fetch(p.data)).blob() })));
      const { beluik, ...rec } = r; rec.photos = photos;
      docs.set(rec.id, rec); await DB.put(rec); n++;
    }
    refreshBPins(); openBList(); status(`Imported ${n} beluik record${n === 1 ? "" : "s"}`);
  } catch (err) { status("That file isn't a Walking Gent export."); }
};

// ---- layer chips ----
function toggle(which) {
  if (which === "sights") { showSights = !showSights; showSights ? sightsLayer.addTo(map) : map.removeLayer(sightsLayer); }
  if (which === "beluiken") { showBeluiken = !showBeluiken; refreshBPins(); }
  if (which === "gone") { showGone = !showGone; refreshBPins(); }
  $("chipSights").setAttribute("aria-pressed", showSights);
  $("chipBeluiken").setAttribute("aria-pressed", showBeluiken);
  $("chipGone").setAttribute("aria-pressed", showGone);
  $("chipGone").hidden = !showBeluiken;
}
$("chipSights").onclick = () => toggle("sights");
$("chipBeluiken").onclick = () => toggle("beluiken");
$("chipGone").onclick = () => toggle("gone");
loadBeluiken();

// ---- location ----
const meIcon = L.divIcon({ className: "", html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
function onPos(pos) {
  const first = !me;
  me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
  const ll = [me.lat, me.lng];
  if (!meMarker) {
    meMarker = L.marker(ll, { icon: meIcon, zIndexOffset: 1000, title: "You are here" }).addTo(map);
    meCircle = L.circle(ll, { radius: pos.coords.accuracy, color: "#1a73e8", weight: 1, fillOpacity: .08 }).addTo(map);
  } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(pos.coords.accuracy); }
  if (first || follow) {
    const nearest = PLACES.reduce((a, p) => (distM(me, p) < distM(me, a) ? p : a));
    if (first) {
      const dCentre = distM(me, { lat: 51.0545, lng: 3.7235 });
      if (dCentre > 15000) status("You seem to be outside Ghent. The map stays on the city centre.", 6000);
      else { map.setView(ll, 17); status(`Nearest: ${nearest.name}, ${fmtDist(distM(me, nearest))} away`); }
    } else map.panTo(ll);
  }
}
function onErr(err) {
  const msg = err.code === 1
    ? "Location is blocked. Allow location for this page in your browser settings and try again."
    : "Couldn't find your location. Check that GPS is on and try again.";
  status(msg, 7000);
}
$("locateBtn").onclick = () => {
  if (!("geolocation" in navigator)) { status("This browser can't share your location."); return; }
  follow = true;
  if (me) map.setView([me.lat, me.lng], Math.max(map.getZoom(), 17));
  else status("Finding you…", 0);
  if (watchId == null) watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
};
map.on("dragstart", () => (follow = false));
</script>
</body>
</html>
